<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slime-Sync</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      #app {
        position: relative;
      }

      #game-container {
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      #login-screen {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        text-align: center;
        z-index: 1000;
      }

      #login-screen.hidden {
        display: none;
      }

      #login-screen h1 {
        color: #667eea;
        margin-bottom: 20px;
        font-size: 32px;
      }

      #login-screen input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 2px solid #ddd;
        border-radius: 5px;
        font-size: 16px;
        transition: border-color 0.3s;
      }

      #login-screen input:focus {
        outline: none;
        border-color: #667eea;
      }

      #login-screen button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 18px;
        cursor: pointer;
        transition: transform 0.2s;
      }

      #login-screen button:hover {
        transform: scale(1.05);
      }

      #login-screen button:active {
        transform: scale(0.95);
      }

      #connection-status {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 8px 16px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border-radius: 5px;
        font-size: 14px;
        z-index: 100;
      }

      #connection-status.connected {
        background: rgba(34, 197, 94, 0.8);
      }

      #connection-status.disconnected {
        background: rgba(239, 68, 68, 0.8);
      }

      #player-count {
        position: absolute;
        top: 10px;
        left: 10px;
        padding: 8px 16px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border-radius: 5px;
        font-size: 14px;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="login-screen">
        <h1>🟢 Slime-Sync</h1>
        <input type="text" id="player-name" placeholder="Enter your name" maxlength="20" />
        <button id="join-button">Join Game</button>
      </div>
      <div id="connection-status" class="disconnected">Disconnected</div>
      <div id="player-count">Players: 0</div>
      <div id="game-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
